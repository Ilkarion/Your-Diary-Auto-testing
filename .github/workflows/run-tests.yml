name: Run Selenium Tests

on:
  repository_dispatch:
    types: [run-selenium-tests]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout Selenium Code
        uses: actions/checkout@v4


      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '20'

      - name: Run Maven Tests
        run: mvn clean test